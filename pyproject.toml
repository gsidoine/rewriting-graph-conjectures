[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rewriting-graph-conjectures"
version = "0.2.0"
description = "Computational local-normalization research programme for graph conjectures"
authors = [{name = "Guillaume Sidoine"}]
requires-python = ">=3.10"
dependencies = ["networkx==3.6.1", "numpy>=1.26", "pandas>=2.1", "sympy>=1.12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["applications*", "shared*", "certificate_coordination*"]

[tool.pytest.ini_options]
testpaths = ["tests", "applications/berge_fulkerson/tests", "applications/three_decomposition/tests", "applications/barnette/tests", "applications/berge_fulkerson/plateau/next_phase", "certificate_coordination/tests"]
addopts = "-ra"
